name: Audio FFT verification

on:
  push:
    branches: [perf/cached-audio-fft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Full Android and Wear compilation
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Compile application and run module regressions
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug :app:testDebugUnitTest \
            --tests 'com.alananasss.kittytune.AudioFftParityTest' --tests 'com.alananasss.kittytune.AutomixTest' \
            --stacktrace --console=plain --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee audio-fft-android.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-fft-android-results
          path: |
            audio-fft-android.log
            app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7
