name: Startup and library verification

on:
  push:
    branches: [perf/startup-library-memory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Android Wear unit and emulator checks
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the project Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Run isolated component regressions and benchmarks
        run: python3 experiments/startup-library/run.py --output verification/startup-library
      - name: Compile all debug variants including native libraries
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --tests 'com.alananasss.kittytune.core.ProcessInitializerTest' \
            --tests 'com.alananasss.kittytune.core.CoalescingTaskTest' \
            --tests 'com.alananasss.kittytune.data.StoredLikesTest' \
            --tests 'com.alananasss.kittytune.ui.library.LibraryCollectionsTest' \
            --tests 'com.alananasss.kittytune.data.LikeBlacklistBatchTest' \
            --stacktrace --console=plain --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee startup-library-android.log
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room projection and Compose scope regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 1536
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.alananasss.kittytune.data.DownloadedIdsProjectionTest,com.alananasss.kittytune.ui.player.PlayerPositionScopeTest --stacktrace --console=plain --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-library-results
          path: |
            startup-library-android.log
            verification/startup-library
            app/build/test-results/testDebugUnitTest
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: startup-library-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 7
